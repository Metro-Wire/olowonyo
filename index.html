    </main>
    <script>
      (() => {
        const stage = document.querySelector('.wallpaper-stage');
        const trigger = document.querySelector('.wordmark-trigger');
        const animated = document.querySelector('.wordmark-animated');
        if (!stage || !trigger || !animated) return;
        function replay() {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          stage.classList.remove('is-shining');
          void stage.offsetWidth; // Restart a single sweep on each hover or tap.
          stage.classList.add('is-shining');
        }
        trigger.addEventListener('pointerenter', (event) => {
          if (event.pointerType === 'mouse' || event.pointerType === 'pen') replay();
        });
        trigger.addEventListener('click', replay);
        animated.addEventListener('animationend', (event) => {
          if (event.animationName === 'wordmark-enlarge') {
            stage.classList.remove('is-shining');
          }
        });
      })();
    </script>
</body>
